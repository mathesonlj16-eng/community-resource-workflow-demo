name: Disposable WordPress integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create disposable database credentials and boot localhost-only stack
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'DEMO_DB_PASSWORD=%s\nDEMO_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
          docker compose config --quiet
          docker compose up -d
          for attempt in $(seq 1 80); do
            if curl --silent --show-error --fail --location --max-time 5 \
              'http://127.0.0.1:8088/wp-admin/install.php' --output /dev/null 2>/dev/null; then
              echo "WordPress installation endpoint reachable"
              exit 0
            fi
            sleep 3
          done
          echo 'WordPress did not become ready' >&2
          exit 1
      - name: Install WordPress and activate the demo plugin
        shell: bash
        run: |
          set -euo pipefail
          TEST_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          export TEST_ADMIN_PASSWORD
          docker compose exec -T -e TEST_ADMIN_PASSWORD="$TEST_ADMIN_PASSWORD" wordpress php < tests/wp-install.php
          docker compose exec -T wordpress php < seed-local.php > "$RUNNER_TEMP/seed-urls.txt"
          cat "$RUNNER_TEMP/seed-urls.txt"
          directory_url="$(sed -n '1p' "$RUNNER_TEMP/seed-urls.txt" | tr -d '\r')"
          submission_url="$(sed -n '2p' "$RUNNER_TEMP/seed-urls.txt" | tr -d '\r')"
          python3 tests/wordpress_e2e.py "$directory_url" "$submission_url"
      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs --tail=140
      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
